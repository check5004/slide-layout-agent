name: Test editable PowerPoint workflow
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/make_demo.py
      - run: python -m slide_agent validate examples/demo.plan.json --source examples/demo.source.json
      - run: python -m slide_agent render examples/demo.plan.json --source examples/demo.source.json --out out/demo.pptx
